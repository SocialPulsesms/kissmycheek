<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kiss My Cheek</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #070709;
      color: #FFF6D6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .crown-ring {
      width: 90px;
      height: 90px;
      border: 3px solid #D4AF37;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
      animation: pulse 2s infinite ease-in-out;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.25em;
      background: linear-gradient(135deg, #FFF6D6 0%, #D4AF37 50%, #AA820A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: rgba(212, 175, 55, 0.8);
      text-transform: uppercase;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 15px #D4AF37); }
    }
  </style>
  <script>
    // Redirect to discover
    window.location.href = '/discover';
  </script>
</head>
<body>
  <div class="logo-container">
    <div class="crown-ring">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 32L11 16L24 25L37 16L41 32H7Z" fill="rgba(212, 175, 55, 0.15)"/>
        <circle cx="11" cy="14" r="2.5" fill="#D4AF37" stroke="none"/>
        <circle cx="24" cy="22" r="2.5" fill="#D4AF37" stroke="none"/>
        <circle cx="37" cy="14" r="2.5" fill="#D4AF37" stroke="none"/>
        <path d="M13 36H35" stroke-width="2.5"/>
      </svg>
    </div>
    <div class="title">Kiss My Cheek</div>
    <div class="subtitle">Social & Dating Club</div>
  </div>
</body>
</html>
